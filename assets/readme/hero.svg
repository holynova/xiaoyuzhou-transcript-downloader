<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">小宇宙 Transcript 下载器 — 播客全集清单与转录批量下载</title>
  <desc id="desc">暖纸底标题：小宇宙播客转录下载；右侧是三步流程：播客名、URL 或 ID → 完整节目清单 → 每期 transcript.json 批量下载。</desc>

  <rect width="1200" height="360" rx="26" fill="#f3f0e8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#96421f">小宇宙播客 · PODCAST TRANSCRIPT DOWNLOADER</text>
    <text x="56" y="132" font-size="58" font-weight="700" fill="#23211d">小宇宙播客转录下载</text>
    <text x="56" y="176" font-size="23" fill="#4a463f">Xiaoyuzhou Transcript Downloader</text>
    <text x="56" y="214" font-size="19" fill="#6b655c">输入播客名、URL 或 ID，一次拉完完整节目清单，批量下载每期 transcript。</text>
    <g id="chips" font-size="18" fill="#23211d" text-anchor="middle">
      <g><rect x="56" y="244" width="120" height="36" rx="18" fill="#e8e0d2" stroke="#d8cfba" stroke-width="1.5"/><text x="116" y="268">完整清单</text></g>
      <g><rect x="188" y="244" width="120" height="36" rx="18" fill="#e8e0d2" stroke="#d8cfba" stroke-width="1.5"/><text x="248" y="268">断点续跑</text></g>
      <g><rect x="320" y="244" width="120" height="36" rx="18" fill="#e8e0d2" stroke="#d8cfba" stroke-width="1.5"/><text x="380" y="268">随机间隔</text></g>
      <g><rect x="452" y="244" width="120" height="36" rx="18" fill="#e8e0d2" stroke="#d8cfba" stroke-width="1.5"/><text x="512" y="268">失败重试</text></g>
    </g>
  </g>

  <g id="flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="step1">
      <rect x="760" y="48" width="384" height="72" rx="14" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/>
      
      
      <text x="830" y="78" font-size="20" font-weight="700" fill="#23211d">播客名 / URL / ID</text>
      <text x="830" y="104" font-size="18" fill="#6b655c">例如「半拿铁」或 24 位播客 ID</text>
          <rect x="782" y="66" width="36" height="36" rx="18" fill="#b5532d"/>
      <text x="800" y="91" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g id="arrow1" fill="#b5532d">
      <rect x="948" y="120" width="8" height="18"/>
      <polygon points="952,148 940,132 964,132"/>
    </g>
    <g id="step2">
      <rect x="760" y="148" width="384" height="72" rx="14" fill="#ffffff" stroke="#d8cfba" stroke-width="1.5"/>
      
      
      <text x="830" y="178" font-size="20" font-weight="700" fill="#23211d">完整节目清单</text>
      <text x="830" y="204" font-size="18" fill="#6b655c">episodes.json，不止首屏 15 条</text>
          <rect x="782" y="166" width="36" height="36" rx="18" fill="#b5532d"/>
      <text x="800" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    </g>
    <g id="arrow2" fill="#b5532d">
      <rect x="948" y="220" width="8" height="18"/>
      <polygon points="952,248 940,232 964,232"/>
    </g>
    <g id="step3">
      <rect x="760" y="248" width="384" height="72" rx="14" fill="#23211d"/>
      
      
      <text x="830" y="278" font-size="20" font-weight="700" fill="#f3f0e8">transcript.json × N</text>
      <text x="830" y="304" font-size="18" fill="#c9c2b4">每期一份，批量下载</text>
          <rect x="782" y="266" width="36" height="36" rx="18" fill="#b5532d"/>
      <text x="800" y="291" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    </g>
  </g>
</svg>
